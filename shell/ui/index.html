<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DigUp</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main id="panel" class="panel">
    <header class="field">
      <svg class="glass" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10" cy="10" r="6.5"/><path d="M15 15 L20.5 20.5"/>
      </svg>
      <input id="query" type="text" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search"
             placeholder="Describe it: “payment error screenshot”, “zebra in a video”…">
      <span id="activity" class="activity" hidden></span>
      <button id="folders" class="folders" type="button" title="Choose folders (Ctrl+,)" aria-label="Choose folders">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2.5 L12 5 M12 19 L12 21.5 M2.5 12 L5 12 M19 12 L21.5 12 M5.3 5.3 L7.1 7.1 M16.9 16.9 L18.7 18.7 M5.3 18.7 L7.1 16.9 M16.9 7.1 L18.7 5.3"/>
          <circle cx="12" cy="12" r="6.5"/>
        </svg>
      </button>
    </header>
    <section id="body" class="body" hidden>
      <div id="list" class="list" role="listbox" aria-label="Results"></div>
      <div id="preview" class="preview" aria-live="polite"></div>
    </section>
    <footer id="footer" class="footer" hidden>
      <span id="summary" class="summary"></span>
      <span id="keys" class="keys"></span>
    </footer>
  </main>
  <script src="panel.js"></script>
</body>
</html>
